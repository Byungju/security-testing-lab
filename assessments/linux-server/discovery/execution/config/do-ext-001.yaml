# DO-EXT-001 Network Reachability Identification 실행 Configuration
# Target: 192.168.216.39 (승인된 테스트 랩 대상)
#
# 검증 방식의 의미:
#   icmp: 주 Reachability 검증 (ICMP 기반)
#   tcp : 선택적/보조 Reachability 검증. Port Discovery가 아니며,
#         config에 명시된 포트에 대해서만 연결 가능 여부를 관찰한다.
#   path: diagnostic evidence 수집용. Reachability 성공/실패를 직접 판정하지 않는다.

execution_id: ""

objective: DO-EXT-001
test_case: TC-EXT-001-01
procedure: TP-EXT-001-01

target: "192.168.216.39"
target_type: linux-server
assessment_perspective: external

scope:
  include:
    - "192.168.216.39"
  exclude: []

verification_methods:
  - name: icmp
    technique: ICMP-based reachability verification
    tool: ping
    options: ["-c", "4", "-W", "2"]
    timeout_seconds: 15
    enabled: true

  - name: tcp
    technique: TCP connectivity verification
    tool: nc
    # 비어 있으면 TCP 검증을 실행하지 않는다(임의 포트 선택/스캔 금지).
    ports: [22,8443]
    options: ["-v", "-w", "3"]
    timeout_seconds: 10
    enabled: true

  - name: path
    technique: Network path observation (diagnostic)
    tool: tracepath
    options: []
    timeout_seconds: 20
    enabled: true 

evidence:
  output_dir: results

environment:
  allowed_tools: [ping, nc, tracepath]
  allow_execution: true
